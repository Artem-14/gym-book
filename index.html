<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Фитнес-тренер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f2f4);
  --tx:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8f98);
  --ac:var(--tg-theme-button-color,#2a7de1);
  --act:var(--tg-theme-button-text-color,#fff);
  --link:var(--tg-theme-link-color,#2a7de1);
  --danger:#e5484d; --ok:#2fb36d;
}
*{-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg2);color:var(--tx);font-family:'Manrope',system-ui,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.card{background:var(--bg);border-radius:20px;padding:16px}
.hint{color:var(--hint)}
.btn{background:var(--ac);color:var(--act);border-radius:16px;font-weight:700;padding:14px 18px;width:100%;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-ghost{background:var(--bg2);color:var(--tx)}
.chip{border-radius:14px;background:var(--bg2);font-weight:700;transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ac);color:var(--act)}
.chip:disabled{opacity:.3;text-decoration:line-through;pointer-events:none}
.hero{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));color:var(--act);border-radius:26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.sk{background:linear-gradient(90deg,var(--bg2),color-mix(in srgb,var(--hint) 22%,var(--bg2)),var(--bg2));border-radius:14px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fade{animation:fadeIn .6s ease both}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(47,179,109,.5)}50%{box-shadow:0 0 0 10px rgba(47,179,109,0)}}
.gift{background:color-mix(in srgb,var(--ok) 16%,var(--bg));color:var(--tx);border:1.5px solid var(--ok);border-radius:18px;animation:glow 2s infinite,fadeIn .6s ease both}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;border-top:1px solid color-mix(in srgb,var(--hint) 25%,transparent);z-index:10}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;font-size:11px;font-weight:700;color:var(--hint)}
.nav button span{font-size:20px}
.nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 58px;padding:10px 0;text-align:center}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .3s;z-index:50;max-width:90%}
.toast.show{transform:translate(-50%,0)}
input,textarea,select{background:var(--bg2);color:var(--tx);border-radius:14px;padding:12px;width:100%;outline:none;font:inherit}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.ba{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:16px;background:var(--bg2)}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba img.b{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.ba i{position:absolute;top:0;bottom:0;left:var(--p);width:3px;margin-left:-1px;background:#fff;box-shadow:0 0 6px #0006}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;padding:0;border-radius:0}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<main id="app" class="max-w-md mx-auto px-3 pt-3 space-y-3"></main>
<nav class="nav max-w-md mx-auto" id="nav">
  <button data-t="cab"><span>👤</span>Кабинет</button>
  <button data-t="book"><span>📅</span>Запись</button>
  <button data-t="plans"><span>💳</span>Тарифы</button>
</nav>

<script>
'use strict';
/* ===== КОНФИГ ===== */
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbws1g6JzvEz10AWq8iDEbgNpcabJ4olE9yYFDZT1WzC8z2OLSus4b56HHhDGMeSBqE8/exec'; // URL веб-приложения Google Apps Script (…/exec). Пусто = демо-режим с моковыми данными
const BOT_USERNAME = 'FitNourishBot';
const TRAINER_USERNAME = 'tema_crow';
const SINGLE_PRICE = 2700;
const CANCEL_LIMIT_H = 12;
const TARIFFS = [
  {id:'test', name:'Тест-драйв', n:4,  price:10000, old:4*SINGLE_PRICE},
  {id:'std',  name:'Стандарт',   n:10, price:24000, old:10*SINGLE_PRICE, top:true},
  {id:'res',  name:'Результат',  n:20, price:45000, old:20*SINGLE_PRICE},
];

/* ===== TELEGRAM ===== */
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const hap = {
  tap:()=>tg?.HapticFeedback?.selectionChanged(),
  hit:()=>tg?.HapticFeedback?.impactOccurred('light'),
  ok:()=>tg?.HapticFeedback?.notificationOccurred('success'),
  err:()=>tg?.HapticFeedback?.notificationOccurred('error'),
};

/* ===== МОСКОВСКОЕ ВРЕМЯ (UTC+3, без DST) ===== */
const MSK = 3*3600e3;
const p2 = n => String(n).padStart(2,'0');
const mskNow = () => new Date(Date.now()+MSK);                     // читать только через getUTC*
const ymd = d => `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())}`;
const mskTs = (date,time) => Date.parse(`${date}T${time}:00+03:00`); // реальный timestamp слота
const mskDayAt = i => new Date(mskNow().getTime()+i*864e5);
const fmtDate = (date,opt) => new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',...opt}).format(new Date(mskTs(date,'12:00')));
const hoursLeft = (date,time) => (mskTs(date,time)-Date.now())/3600e3;

/* ===== API ===== */
async function api(action, payload={}){
  if(!BACKEND_URL) return mock(action,payload);
  const initData = tg?.initData || '';
  if(action==='init'){
    const q = new URLSearchParams({action,initData,from:ymd(mskDayAt(0)),to:ymd(mskDayAt(13))});
    const r = await fetch(`${BACKEND_URL}?${q}`); return r.json();
  }
  // text/plain — чтобы избежать CORS preflight в Google Apps Script
  const r = await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,initData,...payload})});
  return r.json();
}
function mock(action,pl){
  return new Promise(res=>setTimeout(()=>{
    if(action==='init'){
      const d1=ymd(mskDayAt(1)), busy={};
      for(let i=0;i<7;i++) busy[ymd(mskDayAt(i))]=['10:00','10:30','15:00','17:30'].filter((_,k)=>(k+i)%2===0);
      res({profile:{name:'Анна Петрова',phone:'+7 999 123-45-67',email:'anna@example.com',balance:1,expires:ymd(mskDayAt(58)),isNew:true,refId:'48213',
        next:{id:'b1',date:d1,time:'18:00',comment:'Силовая, акцент на спину'}},busy});
    } else if(action==='pay') res({confirmation_url:'https://yookassa.ru/'});
    else res({ok:true});
  },1400));
}

/* ===== СОСТОЯНИЕ ===== */
const S = {tab:'cab', loading:true, profile:null, scheduleSlots:[], dur:60, day:ymd(mskDayAt(0)), time:null, slotId:null, comment:'', busyBtn:false};
const $app = document.getElementById('app');
const $nav = document.getElementById('nav');
const fmt = n => Number(n).toLocaleString('ru-RU');

const sk = (h,w='100%') => `<div class="sk" style="height:${h}px;width:${w}"></div>`;
function skeleton(){
  if(S.tab==='cab') return `<div class="card space-y-3">${sk(22,'55%')}${sk(14,'40%')}${sk(14,'65%')}</div>${sk(150)}${sk(120)}${sk(90)}`;
  if(S.tab==='book') return `${sk(48)}${sk(44)}<div class="flex gap-2">${[1,2,3,4,5].map(()=>sk(66,'58px')).join('')}</div><div class="grid grid-cols-4 gap-2">${Array(12).fill(sk(44)).join('')}</div>${sk(80)}`;
  return [1,2,3].map(()=>sk(200)).join('');
}

/* ===== ВЬЮХИ ===== */
function viewCab(){
  const p=S.profile, n=p.next;
  const left = n ? hoursLeft(n.date,n.time) : 0;
  const canCancel = n && left>=CANCEL_LIMIT_H;
  const nextDate = n ? fmtDate(n.date,{weekday:'long',day:'numeric',month:'long'}) : '';
  return `
  <section class="card fade">
    <div class="text-xl font-extrabold">${esc(p.name)}</div>
    <div class="hint text-sm mt-1">${esc(p.phone)}</div>
    <div class="hint text-sm">${esc(p.email)}</div>
    <div class="hint text-xs mt-2 bg-black/5 dark:bg-white/5 rounded-lg px-2 py-1 inline-block">ID: ${esc(p.refId)}</div>
  </section>

  <section class="hero p-5 fade">
    <div class="text-sm opacity-80 font-semibold">Осталось занятий</div>
    <div class="font-extrabold leading-none mt-1" style="font-size:76px">${p.balance}</div>
    ${p.balance>0
      ? `<div class="text-sm opacity-90 mt-3 font-semibold">Абонемент действует до: ${fmtDate(p.expires,{day:'numeric',month:'long',year:'numeric'})}</div>`
      : `<div class="fade mt-3 text-sm font-bold bg-white/20 rounded-xl px-3 py-2 inline-block">Баланс пуст. Пополните в тарифах</div>`}
  </section>

  ${p.isNew && p.balance===1 ? `<div class="gift p-4 font-bold text-sm">🎁 Вам доступна 1 бесплатная пробная тренировка!</div>`:''}

  <section class="card fade">
    <div class="font-extrabold mb-2">Ближайшая тренировка</div>
    ${n ? `
      <div class="text-lg font-bold">${nextDate}, ${n.time}</div>
      ${n.comment?`<div class="hint text-sm mt-1">${esc(n.comment)}</div>`:''}
      <button id="cancel" class="btn btn-ghost mt-3" ${canCancel?'':'disabled'} style="${canCancel?'color:var(--danger)':''}">Отмена</button>
      ${canCancel?'':`<div class="hint text-xs mt-2">Отмена недоступна: до тренировки меньше ${CANCEL_LIMIT_H} часов</div>`}`
    : `<div class="hint text-sm">Записей нет. Выберите время во вкладке «Запись».</div>`}
  </section>

  <section class="card fade">
    <div class="font-extrabold mb-2">Прогресс «До / После»</div>
    ${ba(p.pb,p.pa)}
    <div class="grid grid-cols-2 gap-2 mt-3"><button data-ph="before" class="btn btn-ghost">Фото «До»</button><button data-ph="after" class="btn btn-ghost">Фото «После»</button></div>
  </section>

  <button id="freeze" class="btn btn-ghost" ${p.frozen||p.balance<=0?'disabled':''}>❄️ Заморозить абонемент на 14 дней${p.frozen?' (использовано)':''}</button>

  <section class="card fade">
    <div class="font-extrabold">Приведи друга</div>
    <div class="hint text-sm mt-1 mb-3">Отправьте ссылку: друг получит пробное занятие, а вы — бонус.</div>
    <button id="share" class="btn">Поделиться ссылкой</button>
  </section>

  <button id="msg" class="btn btn-ghost">Написать тренеру</button>`;
}

function slotsFor(date){
  return (S.scheduleSlots||[]).filter(s=>s&&s.date===date).sort((x,y)=>x.time.localeCompare(y.time))
    .map(s=>({t:s.time,id:s.id,free:!!(s.ok&&s.ok[S.dur/30])}));
}

function viewBook(){
  const price = S.dur===90?4050:SINGLE_PRICE;
  const empty = !S.profile.isAdmin && S.profile.balance < S.dur/60;
  const days = Array.from({length:14},(_,i)=>ymd(mskDayAt(i)));
  const slots = slotsFor(S.day);
  return `
  <button id="topup" class="btn btn-ghost fade">Пополнить баланс</button>
  <div class="card fade">
    <div class="grid grid-cols-2 gap-2">
      ${[[60,'1 час'],[90,'1.5 часа']].map(([v,l])=>`<button data-dur="${v}" class="chip py-3 ${S.dur===v?'on':''}">${l}</button>`).join('')}
    </div>
  </div>
  <div class="days fade">
    ${days.map(d=>`<button data-day="${d}" class="chip day ${S.day===d?'on':''}">
      <div class="text-xs opacity-70">${fmtDate(d,{weekday:'short'})}</div>
      <div class="text-xl font-extrabold">${fmtDate(d,{day:'numeric'})}</div>
      <div class="text-xs opacity-70">${fmtDate(d,{month:'short'}).replace('.','')}</div></button>`).join('')}
  </div>
  <div class="card fade">
    <div class="font-extrabold mb-3">Время (МСК)</div>
    <div class="grid grid-cols-4 gap-2">
      ${slots.map(s=>`<button data-time="${s.t}" data-id="${s.id}" ${s.free?'':'disabled'} class="chip py-3 text-sm ${S.time===s.t?'on':''}">${s.t}</button>`).join('')}
    </div>
  </div>
  <textarea id="comment" rows="2" placeholder="Комментарий к бронированию">${esc(S.comment)}</textarea>
  <button id="confirm" class="btn" style="padding:18px;font-size:16px" ${S.time&&!S.busyBtn&&!S.profile.isAdmin?'':'disabled'}>
    ${empty?`Оплатить и записаться (${price.toLocaleString('ru-RU')} ₽)`:'Подтвердить запись'}</button>`;
}

function viewPlans(){
  return TARIFFS.map(t=>{
    const disc = Math.round((1-t.price/t.old)*100);
    return `<section class="card fade ${t.top?'ring-2':''}" style="${t.top?'--tw-ring-color:var(--ac)':''}">
      <div class="flex justify-between items-start">
        <div><div class="text-xl font-extrabold">${t.name}</div><div class="hint text-sm">${t.n} занятий</div></div>
        <div class="px-3 py-1 rounded-full text-sm font-extrabold" style="background:var(--ok);color:#fff">−${disc}%</div>
      </div>
      <div class="mt-3 flex items-baseline gap-2">
        <span class="text-3xl font-extrabold">${t.price.toLocaleString('ru-RU')} ₽</span>
        <span class="hint line-through text-sm">${t.old.toLocaleString('ru-RU')} ₽</span>
      </div>
      <div class="hint text-sm mt-1">${Math.round(t.price/t.n).toLocaleString('ru-RU')} ₽ за занятие</div>
      <div class="hint text-xs mt-2">Срок действия пакета — 2 месяца (60 дней)</div>
      <button data-buy="${t.id}" class="btn mt-3">Купить пакет</button>
    </section>`;
  }).join('');
}

/* ===== РЕНДЕР И СОБЫТИЯ ===== */
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const NAV_C=[['cab','👤','Кабинет'],['book','📅','Запись'],['plans','💳','Тарифы']];
const NAV_A=[['diary','📓','Дневник'],['clients','👥','Клиенты'],['income','💰','Доходы'],['book','📅','Сетка']];
function render(){
  const nv = S.profile?.isAdmin ? NAV_A : NAV_C;
  $nav.innerHTML = nv.map(([t,i,l])=>`<button data-t="${t}" class="${S.tab===t?'on':''}"><span>${i}</span>${l}</button>`).join('');
  const V={cab:viewCab,book:viewBook,plans:viewPlans,diary:viewDiary,clients:viewClients,income:viewIncome};
  $app.innerHTML = S.loading ? skeleton() : V[S.tab]();
  if(!S.loading) bind();
}
function go(t){ S.tab=t; S.cl=null; S.fin=null; render(); window.scrollTo({top:0});
  if(S.profile?.isAdmin && t!=='book') loadAdmin().then(render).catch(()=>{}); }
const $ = s => $app.querySelector(s);
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}

function bind(){
  $app.querySelectorAll('[data-dur]').forEach(b=>b.onclick=()=>{hap.tap();S.dur=+b.dataset.dur;S.time=null;render()});
  $app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{hap.tap();S.day=b.dataset.day;S.time=null;render();$app.querySelector('.day.on')?.scrollIntoView({inline:'center',block:'nearest'})});
  $app.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{
   hap.hit();
   S.comment=$('#comment').value;
   S.time=b.dataset.time;
   S.slotId=b.dataset.id; // Дописываем эту строчку, чтобы запомнить ID
   render();
});
  $app.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{hap.hit();buy(b.dataset.buy)});
  $('#comment')?.addEventListener('input',e=>S.comment=e.target.value);
  $('#topup')?.addEventListener('click',()=>{hap.tap();go('plans')});
  $('#confirm')?.addEventListener('click',confirmBooking);
  $('#share')?.addEventListener('click',()=>{
    hap.hit();
    const link=`https://t.me/${BOT_USERNAME}?start=ref_${S.profile.refId}`;
    const url=`https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Иди тренироваться со мной! Первая тренировка — в подарок 🎁')}`;
    tg?.openTelegramLink ? tg.openTelegramLink(url) : window.open(url,'_blank');
  });
  $('#msg')?.addEventListener('click',()=>{hap.tap();const u=`https://t.me/${TRAINER_USERNAME}`;tg?.openTelegramLink?tg.openTelegramLink(u):window.open(u,'_blank')});
  $('#cancel')?.addEventListener('click',cancelBooking);
  bindExtra();
}

async function cancelBooking(){
  const n=S.profile.next;
  if(!n||hoursLeft(n.date,n.time)<CANCEL_LIMIT_H) return;
  const ok = tg?.showConfirm ? await new Promise(r=>tg.showConfirm('Отменить тренировку?',r)) : confirm('Отменить тренировку?');
  if(!ok) return;
  hap.hit();
  try{ const r=await api('cancel',{bookingId:n.id}); if(!r.ok) throw new Error(r.error); S.profile.next=null; S.profile.balance+=r.refund||0; hap.ok(); toast('Запись отменена ❌'); render(); }
  catch(e){ hap.err(); toast('Не удалось отменить. Попробуйте ещё раз') }
}

async function confirmBooking(){
  if(!S.time||S.busyBtn) return;
  S.busyBtn=true; $('#confirm').disabled=true;
  try{
    if(S.profile.balance<S.dur/60){
      const r = await api('pay',{type:'single',slotId:S.slotId,duration:S.dur/30,comment:S.comment});
      if(!r.confirmation_url) throw new Error(r.error||'Платёж не создан');
      openPay(r.confirmation_url); return;
    }
    
    // Отправляем бронь на бэкенд по ID слота
    const r = await api('book',{slotId: S.slotId, duration: S.dur/30, comment: S.comment});
    if(r.error) throw new Error(r.error);
    
    // ОЧИЩАЕМ СТАРУЮ ДЕМО-ЛОГИКУ, КОТОРАЯ ВЫЗЫВАЛА СБОЙ
    S.time=null; 
    S.slotId=null;
    S.comment=''; 
    
    hap.ok(); 
    toast('Вы записаны ✅'); 
    
    // Принудительно перезапускаем загрузку данных, чтобы фронтенд скачал свежие слоты из таблицы
    S.loading=true; 
    render();
    
    // Перезапрашиваем init(), чтобы обновить баланс в профиле и сетку времени
    const d = await api('init'); if(d.ok===false) throw new Error(d.error);
    S.profile=d.profile; 
    S.scheduleSlots=d.scheduleSlots||[];
    S.loading=false; 
    
    go('cab'); // Переключаем пользователя на главный экран Личного кабинета
  }catch(e){ hap.err(); toast(e.message||'Не удалось записаться') }
  finally{ S.busyBtn=false; if(S.tab==='book') render(); }
}


async function buy(id){
  const t=TARIFFS.find(x=>x.id===id);
  try{ 
    const r = await api('pay',{type:'package',tariff:id,amount:t.price}); 
    
    if(r.error) {
      hap.err();
      toast('Ошибка: ' + r.error);
      return;
    }
    
    if(!r.confirmation_url){ 
      hap.err(); 
      toast('Платёж не создан'); 
      return; 
    }
    
    // ИСПРАВЛЕННЫЙ БЛОК ОТКРЫТИЯ ССЫЛКИ ДЛЯ ТЕЛЕФОНА:
    if (window.Telegram?.WebApp?.openLink) {
      // Открывает встроенный безопасный браузер Telegram на смартфонах
      window.Telegram.WebApp.openLink(r.confirmation_url); 
    } else {
      // Открывает вкладку, если запустили с компьютера
      window.open(r.confirmation_url, '_blank'); 
    }
    
  } catch(e){ 
    hap.err(); 
    toast('Сбой сети. Попробуйте позже'); 
  }
}


$nav.onclick=e=>{const b=e.target.closest('button');if(!b)return;hap.tap();go(b.dataset.t)};


/* ===== ФОТО, ЗАМОРОЗКА, АДМИНКА ===== */
function openPay(u){ tg?.openLink ? tg.openLink(u) : window.open(u,'_blank'); }
const ask = m => tg?.showConfirm ? new Promise(r=>tg.showConfirm(m,r)) : Promise.resolve(confirm(m));
function pickPhoto(cb){
  const i=document.createElement('input'); i.type='file'; i.accept='image/*';
  i.onchange=()=>{const f=i.files[0]; if(!f) return; const img=new Image();
    img.onload=()=>{const k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=img.width*k; c.height=img.height*k; c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.8))};
    img.src=URL.createObjectURL(f)};
  i.click();
}
function pickAudio(cb){
  const i=document.createElement('input'); i.type='file'; i.accept='audio/*,video/*';
  i.onchange=()=>{const f=i.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(f)};
  i.click();
}
function ba(b,a){
  if(!b||!a) return '<div class="hint text-sm">Загрузите оба фото, чтобы увидеть сравнение</div>';
  return `<div class="ba" style="--p:50%"><img src="${esc(a)}" alt=""><img class="b" src="${esc(b)}" alt=""><i></i><input type="range" min="0" max="100" value="50"></div>
  <div class="flex justify-between text-xs hint mt-1"><span>До</span><span>После</span></div>`;
}
function uploadPhoto(kind,tgId){
  pickPhoto(async d=>{
    try{ toast('Загружаю…'); const r=await api('photo',{kind,data:d,tgId}); if(!r.ok) throw new Error(r.error);
      const o = tgId ? S.adm.clients.find(c=>c.id===tgId) : S.profile; o[kind==='after'?'pa':'pb']=r.url;
      hap.ok(); toast('Фото сохранено'); render();
    }catch(e){ hap.err(); toast(e.message||'Не удалось загрузить фото'); }
  });
}
async function freeze(){
  if(!await ask('Заморозить абонемент на 14 дней? Это можно сделать только один раз.')) return;
  try{ const r=await api('freeze'); if(!r.ok) throw new Error(r.error);
    S.profile.expires=r.expires; S.profile.frozen=1; hap.ok(); toast('Абонемент заморожен ❄️'); render();
  }catch(e){ hap.err(); toast(e.message||'Ошибка'); }
}
async function loadAdmin(){ const a=await api('adminData'); if(!a.ok) throw new Error(a.error); S.adm=a; }

function finForm(){
  return `<section class="card fade ring-2" style="--tw-ring-color:var(--ac)"><div class="font-extrabold mb-2">Завершить занятие</div>
  <textarea id="fp" rows="3" placeholder="Что делали">${esc(S.finP||'')}</textarea>
  <textarea id="ff" rows="2" placeholder="Самочувствие" style="margin-top:8px">${esc(S.finF||'')}</textarea>
  <button id="fv" class="btn btn-ghost mt-2">🎤 Надиктовать (аудиофайл)</button>
  <div class="grid grid-cols-2 gap-2 mt-2"><button id="fx" class="btn btn-ghost">Отмена</button><button id="fs" class="btn">Сохранить</button></div></section>`;
}
function viewDiary(){
  const list = S.adm.today.map(s=>`<section class="card fade"><div class="flex justify-between"><div class="text-lg font-extrabold">${s.time} · ${esc(s.name)}</div><div class="hint text-sm">${s.dur} мин</div></div>
    ${s.comment?`<div class="hint text-sm mt-1">${esc(s.comment)}</div>`:''}
    ${s.program||s.feel?`<div class="text-sm mt-2"><b>Что делали:</b> ${esc(s.program)}<br><b>Самочувствие:</b> ${esc(s.feel)}</div>`
      :(s.started?`<button data-fin="${s.row}" class="btn mt-3">Завершить занятие</button>`:'')}</section>`).join('')
    || '<div class="card hint text-sm">На сегодня записей нет</div>';
  return (S.fin?finForm():'') + `<div class="font-extrabold px-1">Сегодня</div>${list}
  <section class="card fade"><div class="font-extrabold mb-2">Заблокировать день</div><input type="date" id="bd" value="${ymd(mskDayAt(0))}">
  <button id="blk" class="btn btn-ghost mt-2" style="color:var(--danger)">Заблокировать день (выходной)</button></section>`;
}
function clientList(){
  const q=(S.q||'').toLowerCase();
  return S.adm.clients.filter(c=>c.name.toLowerCase().includes(q)).map(c=>`<button data-cl="${c.id}" class="card w-full text-left fade">
    <div class="font-extrabold">${esc(c.name)}</div><div class="hint text-sm">Баланс: ${c.balance}${c.anam?' · ⚠️ есть противопоказания':''}</div></button>`).join('')
    || '<div class="hint text-sm px-1">Никого не найдено</div>';
}
function viewClients(){
  if(S.cl) return clientCard(S.adm.clients.find(x=>x.id===S.cl));
  return `<input id="q" placeholder="Поиск по имени" value="${esc(S.q||'')}"><div id="clist" class="space-y-2">${clientList()}</div>`;
}
function clientCard(c){
  const h=S.hist||[];
  return `<button id="back" class="btn btn-ghost">← Назад</button>
  <section class="card fade"><div class="text-xl font-extrabold">${esc(c.name)}</div>
    <div class="hint text-sm">${esc(c.phone)} ${esc(c.email)}</div>
    <div class="hint text-sm">Баланс: ${c.balance} · до ${c.expires||'—'}${c.frozen?' · ❄️ заморожен':''}</div>
    ${c.goal?`<div class="text-sm mt-1">Цель: ${esc(c.goal)}</div>`:''}</section>
  <section class="card fade" style="background:color-mix(in srgb,var(--danger) 12%,var(--bg));border:1.5px solid var(--danger)">
    <div class="text-xs font-extrabold" style="color:var(--danger)">ПРОТИВОПОКАЗАНИЯ / АНАМНЕЗ</div>
    <div class="text-xl font-extrabold mt-1">${c.anam?esc(c.anam):'Не указаны'}</div>
    ${S.ea?`<textarea id="an" rows="3" style="margin-top:8px">${esc(c.anam)}</textarea><button id="ans" class="btn mt-2">Сохранить</button>`
          :`<button id="ane" class="btn btn-ghost mt-3">Редактировать анамнез</button>`}</section>
  <section class="card fade"><div class="font-extrabold mb-2">Последние 5 тренировок</div>
    ${h.length?h.map(x=>`<div class="text-sm mb-2"><b>${x.date} ${x.time}</b><br>${esc(x.program||'—')}${x.feel?`<br><span class="hint">Самочувствие: ${esc(x.feel)}</span>`:''}</div>`).join(''):'<div class="hint text-sm">История пуста</div>'}</section>
  <section class="card fade"><div class="font-extrabold mb-2">Способ оплаты</div>
    <select id="bk">${['','Сбер','Т-Банк','Нал'].map(b=>`<option value="${b}" ${c.bank===b?'selected':''}>${b||'— абонемент / ЮKassa —'}</option>`).join('')}</select>
    <div class="font-extrabold my-2">Прогресс</div>${ba(c.pb,c.pa)}
    <div class="grid grid-cols-2 gap-2 mt-3"><button data-aph="before" class="btn btn-ghost">Фото «До»</button><button data-aph="after" class="btn btn-ghost">Фото «После»</button></div></section>`;
}
function viewIncome(){
  const i=S.adm.income, rows=Object.entries(i.byBank).map(([k,v])=>`<div class="flex justify-between py-2"><span>${esc(k)}</span><b>${fmt(v)} ₽</b></div>`).join('');
  return `<section class="hero p-5 fade"><div class="text-sm opacity-80 font-semibold">Доход за ${i.label}</div><div class="font-extrabold mt-1" style="font-size:44px">${fmt(i.total)} ₽</div></section>
  <section class="card fade"><div class="font-extrabold mb-1">По способам оплаты</div>${rows||'<div class="hint text-sm">Пока нет данных</div>'}</section>`;
}
function bindCl(){
  $app.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{hap.tap();S.cl=b.dataset.cl;S.hist=[];S.ea=false;render();
    api('history',{tgId:S.cl}).then(r=>{S.hist=r.items||[];render()})});
}
function bindExtra(){
  $app.querySelectorAll('.ba input').forEach(i=>i.oninput=()=>i.parentNode.style.setProperty('--p',i.value+'%'));
  $app.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>uploadPhoto(b.dataset.ph));
  $app.querySelectorAll('[data-aph]').forEach(b=>b.onclick=()=>uploadPhoto(b.dataset.aph,S.cl));
  $('#freeze')?.addEventListener('click',freeze);
  bindCl();
  $('#q')?.addEventListener('input',e=>{S.q=e.target.value;$('#clist').innerHTML=clientList();bindCl()});
  $('#back')?.addEventListener('click',()=>{S.cl=null;render()});
  $('#ane')?.addEventListener('click',()=>{S.ea=true;render()});
  $('#ans')?.addEventListener('click',async()=>{
    const v=$('#an').value; try{const r=await api('setClient',{tgId:S.cl,anam:v}); if(!r.ok) throw new Error(r.error);
      S.adm.clients.find(c=>c.id===S.cl).anam=v; S.ea=false; hap.ok(); toast('Анамнез сохранён'); render();}catch(e){hap.err();toast(e.message||'Ошибка')}});
  $('#bk')?.addEventListener('change',async e=>{
    try{await api('setClient',{tgId:S.cl,bank:e.target.value}); S.adm.clients.find(c=>c.id===S.cl).bank=e.target.value; toast('Сохранено')}catch(_){toast('Ошибка')}});
  $app.querySelectorAll('[data-fin]').forEach(b=>b.onclick=()=>{S.fin=b.dataset.fin;S.finP='';S.finF='';render();window.scrollTo({top:0})});
  $('#fp')?.addEventListener('input',e=>S.finP=e.target.value);
  $('#ff')?.addEventListener('input',e=>S.finF=e.target.value);
  $('#fx')?.addEventListener('click',()=>{S.fin=null;render()});
  $('#fs')?.addEventListener('click',async()=>{
    try{const r=await api('finish',{row:S.fin,program:S.finP,feel:S.finF}); if(!r.ok) throw new Error(r.error);
      S.fin=null; await loadAdmin(); hap.ok(); toast('Занятие завершено ✅'); render();}catch(e){hap.err();toast(e.message||'Ошибка')}});
  $('#fv')?.addEventListener('click',()=>pickAudio(async d=>{
    try{toast('Распознаю…'); const r=await api('voice',{audio:d}); if(!r.ok) throw new Error(r.error);
      S.finP=(S.finP?S.finP+' ':'')+r.text; render();}catch(e){hap.err();toast(e.message||'Ошибка распознавания')}}));
  $('#blk')?.addEventListener('click',async()=>{
    const d=$('#bd').value; if(!d||!await ask('Заблокировать все свободные слоты на '+d+'?')) return;
    try{const r=await api('blockDay',{date:d}); if(!r.ok) throw new Error(r.error);
      const i=await api('init'); S.scheduleSlots=i.scheduleSlots||[];
      toast('Заблокировано слотов: '+r.blocked+(r.kept?` (записей клиентов не тронуто: ${r.kept})`:''));}catch(e){hap.err();toast(e.message||'Ошибка')}});
}

/* ===== СТАРТ ===== */
(async function init(){
  render(); // скелетоны
  try{
    const d = await api('init'); if(d.ok===false) throw new Error(d.error);
    S.profile=d.profile; 
    S.scheduleSlots=d.scheduleSlots||[];
    if(S.profile.isAdmin){S.tab='diary';await loadAdmin();}
    S.loading=false; render();
  }catch(e){
    $app.innerHTML=`<div class="card text-center"><div class="font-extrabold">Не удалось загрузить данные</div><div class="hint text-sm my-2">Проверьте соединение и повторите</div><button class="btn" onclick="location.reload()">Повторить</button></div>`;
  }
})();
// синхронизация темы при смене
tg?.onEvent?.('themeChanged',()=>render());
</script>
</body>
</html>
