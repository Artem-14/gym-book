<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Фитнес-Студия Казань</title>
<!-- Официальный скрипт Telegram Web App -->
<script src="https://telegram.org"></script>
<!-- Корректное подключение TailwindCSS и шрифта -->
<script src="https://jsdelivr.net"></script>
<link href="https://googleapis.com" rel="stylesheet">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);
  --bg2:var(--tg-theme-secondary-bg-color,#f1f2f4);
  --tx:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#8a8f98);
  --ac:var(--tg-theme-button-color,#2a7de1);
  --act:var(--tg-theme-button-text-color,#fff);
  --link:var(--tg-theme-link-color,#2a7de1);
  --danger:#e5484d; --ok:#2fb36d;
}
*{-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg2);color:var(--tx);font-family:'Manrope',system-ui,sans-serif}
body{padding-bottom:calc(94px + env(safe-area-inset-bottom,0px))}
.card{background:var(--bg);border-radius:20px;padding:16px}
.hint{color:var(--hint)}
.btn{background:var(--ac);color:var(--act);border-radius:16px;font-weight:700;padding:14px 18px;width:100%;transition:transform .12s,opacity .2s;text-align:center;display:block;border:none;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-ghost{background:var(--bg2);color:var(--tx)}
.chip{border-radius:14px;background:var(--bg2);font-weight:700;transition:all .15s;border:none;cursor:pointer}
.chip.on{background:var(--ac);color:var(--act)}
.hero{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));color:var(--act);border-radius:26px;position:relative;overflow:hidden}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;border-top:1px solid color-mix(in srgb,var(--hint) 25%,transparent);z-index:40}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:14px;font-size:10px;font-weight:700;color:var(--hint);border:none;background:none;cursor:pointer}
.nav button span{font-size:18px}
.nav button.on{color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 58px;padding:10px 0;text-align:center}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .3s;z-index:100;max-width:90%}
.toast.show{transform:translate(-50%,0)}
input,textarea,select{background:var(--bg2);color:var(--tx);border-radius:14px;padding:12px;width:100%;outline:none;font:inherit;border:none;box-sizing:border-box}
.slider-container{position:relative;width:100%;height:240px;border-radius:16px;overflow:hidden;user-select:none}
.slider-img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.slider-before{z-index:10}
.slider-after{z-index:5}
.slider-handle{position:absolute;top:0;bottom:0;width:4px;background:#fff;z-index:20;cursor:ew-resize}
.slider-button{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;background:#fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#111;font-size:14px}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<nav id="nav-header-placeholder" class="hidden"></nav>
<main id="app" class="max-w-md mx-auto px-3 pt-3 space-y-3"></main>

<nav class="nav max-w-md mx-auto" id="nav">
  <button data-t="cab"><span>👤</span>Кабинет</button>
  <button data-t="book"><span>📅</span>Запись</button>
  <button data-t="plans"><span>💳</span>Тарифы</button>
  <button data-t="admin" id="nav-admin" class="hidden" style="color:var(--danger)"><span>🛠</span>Админка</button>
</nav>

<script>
'use strict';
// ⚠️ СЮДА ВСТАВЬТЕ ВАШ URL ВЕБ-ПРИЛОЖЕНИЯ ИЗ GOOGLE APPS SCRIPT
const BACKEND_URL = 'https://google.com'; 
const SINGLE_1H = 2700;
const SINGLE_15H = 4050;

const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const S = {
  tab: 'cab', 
  loading: true, 
  profile: null, 
  scheduleSlots: [], 
  dur: 60, 
  day: '', 
  time: null, 
  slotId: null, 
  comment: '', 
  isAdmin: false,
  adminData: null,
  activeClient: null,
  sliderPos: 50
};

const p2 = n => String(n).padStart(2,'0');
const mskNow = () => new Date(Date.now() + 3*3600e3);
const ymd = d => `${d.getUTCFullYear()}-${p2(d.getUTCMonth()+1)}-${p2(d.getUTUTCDate())}`;
S.day = ymd(mskNow());

// ИСПРАВЛЕНО: Полностью рабочий метод отправки запросов без синтаксических сломов
async function api(action, payload={}){
  const initData = tg?.initData || '';
  const q = new URLSearchParams({action, initData});
  if(action === 'init' || action === 'adminInit'){
    const r = await fetch(`${BACKEND_URL}?${q}&from=${ymd(mskNow())}`); 
    return r.json();
  }
  const r = await fetch(BACKEND_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action, initData, ...payload})
  });
  return r.json();
}

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg;
  t.classList.add('show'); clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}


function render(){
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  if(S.isAdmin) document.getElementById('nav-admin').classList.remove('hidden');
  
  const $app = document.getElementById('app');
  if(S.loading){ $app.innerHTML = '<div class="p-10 text-center hint">Загрузка данных студии...</div>'; return; }
  
  if(S.tab === 'cab') $app.innerHTML = viewCab();
  else if(S.tab === 'book') $app.innerHTML = viewBook();
  else if(S.tab === 'plans') $app.innerHTML = viewPlans();
  else if(S.tab === 'admin') $app.innerHTML = viewAdmin();
  
  bind();
  if(S.tab === 'cab' && S.profile?.photoBefore) initSlider();
}

function viewCab(){
  const p = S.profile;
  const n = p.next;
  return `
  <section class="card space-y-2">
    <div class="text-xl font-extrabold">${p.name}</div>
    <div class="hint text-sm">${p.phone || 'Телефон не указан'} | ${p.email || 'Email не указан'}</div>
    <div class="text-xs text-red-500 bg-red-50 px-2 py-1 rounded inline-block">Цель: ${p.target || 'Не задана'}</div>
  </section>

  <section class="hero p-5">
    <div class="text-sm opacity-80 font-semibold">Остаток баланса</div>
    <div class="text-6xl font-extrabold my-1">${p.balance} <span class="text-xl">балла</span></div>
    <div class="text-xs opacity-90">Абонемент сгорает через 60 дней после покупки. Действует до: ${p.expires || '—'}</div>
  </section>

  ${p.photoBefore ? `
  <section class="card">
    <div class="font-extrabold mb-2">Ваш прогресс Слайдер</div>
    <div class="slider-container" id="slider">
      <img src="${p.photoAfter || p.photoBefore}" class="slider-img slider-after" />
      <div class="slider-before absolute top-0 left-0 h-full overflow-hidden" style="width:${S.sliderPos}%">
        <img src="${p.photoBefore}" class="absolute top-0 left-0 h-full slider-img" style="width:100%" />
      </div>
      <div class="slider-handle" style="left:${S.sliderPos}%"><div class="slider-button">↔</div></div>
    </div>
  </section>` : ''}

  <section class="card space-y-2">
    <div class="font-extrabold">Управление абонементом</div>
    <button id="freeze-btn" class="btn btn-ghost text-sm w-full" ${p.frozen == 1 ? 'disabled' : ''}>
      ${p.frozen == 1 ? '❄️ Абонемент уже заморожен на 14 дней' : '❄️ Заморозить абонемент (1 раз на 14 дней)'}
    </button>
  </section>

  <section class="card">
    <div class="font-extrabold mb-2">Ближайшее занятие</div>
    ${n ? `<div class="text-md font-bold text-blue-600">${n.date} в ${n.time}</div><div class="text-xs hint mt-1">План: ${n.comment || 'без комментария'}</div>` : '<div class="hint text-sm">Нет активных записей.</div>'}
  </section>
  `;
}

function viewBook(){
  const days = Array.from({length:14}, (_,i) => { const d = mskNow(); d.setDate(d.getDate()+i); return ymd(d); });
  const slots = S.scheduleSlots.filter(s => s.date === S.day);
  const currentPrice = S.dur === 60 ? SINGLE_1H : SINGLE_15H;
  
  return `
  <div class="card grid grid-cols-2 gap-2">
    <button data-dur="60" class="chip py-3 ${S.dur===60?'on':''}">1 час (1 балл)</button>
    <button data-dur="90" class="chip py-3 ${S.dur===90?'on':''}">1.5 часа (1.5 балла)</button>
  </div>
  <div class="days overflow-x-auto pb-1">
    ${days.map(d => `<button data-day="${d}" class="chip day p-2 S.day===d?'on':''">{d.substring(5)}</button>`).join('')}
  </div>
  <div class="card">
    <div class="font-extrabold mb-2">Доступное время в Казани (Амирхана)</div>
    ${slots.length === 0 ? '<div class="p-4 text-center hint text-sm">Свободных окон нет (или действует буфер тренера)</div>' : `
    <div class="grid grid-cols-4 gap-2">
      ${slots.map(s => `<button data-time="${s.time}" data-id="${s.id}" class="chip py-2 text-xs S.time===s.time?'on':''">{s.time}</button>`).join('')}
    </div>`}
  </div>
  <textarea id="book-comment" placeholder="Что хотим проработать на тренировке?">${S.comment}</textarea>
  <button id="book-confirm-btn" class="btn w-full" ${!S.time ? 'disabled' : ''}>
    ${S.profile.balance <= 0 ? `Разовая оплата онлайн (${currentPrice} ₽)` : 'Записаться по абонементу'}
  </button>
  `;
}

function viewPlans(){
  return `
  <div class="space-y-3">
    <div class="card border-2 border-blue-500">
      <div class="font-extrabold text-lg">Пакет «Стандарт» (10 занятий)</div>
      <div class="text-2xl font-black text-blue-600 mt-1">24 000 ₽ <span class="text-xs hint line-through text-gray-400">27 000 ₽</span></div>
      <div class="text-xs hint mt-1">Срок действия: 2 месяца. Выгода 3000 ₽</div>
      <button data-buy="std" class="btn mt-3 w-full">Купить пакет</button>
    </div>
    <div class="card">
      <div class="font-extrabold text-lg">Пакет «Результат» (20 занятий)</div>
      <div class="text-2xl font-black text-blue-600 mt-1">45 000 ₽ <span class="text-xs hint line-through text-gray-400">54 000 ₽</span></div>
      <div class="text-xs hint mt-1">Срок действия: 2 месяца. Выгода 9000 ₽</div>
      <button data-buy="res" class="btn mt-3 w-full">Купить пакет</button>
    </div>
    <div class="card">
      <div class="font-extrabold text-lg">Пакет «Тест-драйв» (4 занятия)</div>
      <div class="text-2xl font-black text-blue-600 mt-1">10 000 ₽ <span class="text-xs hint line-through text-gray-400">10 800 ₽</span></div>
      <div class="text-xs hint mt-1">Срок действия: 2 месяца. Отличный старт</div>
      <button data-buy="test" class="btn mt-3 w-full">Купить пакет</button>
    </div>
  </div>`;
}

}

function viewAdmin(){
  const ad = S.adminData;
  if(!ad) return '<div class="p-5 hint text-center">Загрузка админ-панели...</div>';
  return `
  <div class="space-y-4">
    <div class="card bg-gray-900 text-white p-4 rounded-2xl">
      <div class="text-xs uppercase tracking-wider text-gray-400 font-bold">Финансовый дашборд тренера</div>
      <div class="text-3xl font-black mt-1 text-green-400">${ad.analytics.totalMonth} ₽</div>
      <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-gray-800 text-xs">
        <div>💳 ЮKassa: <b class="text-blue-400">${ad.analytics.yookassa} ₽</b></div>
        <div>💵 Наличные/Сбер: <b class="text-yellow-400">${ad.analytics.cash} ₽</b></div>
      </div>
      <div class="mt-3 flex gap-2">
        <input type="date" id="block-date" class="text-black text-xs p-1 rounded" value="${S.day}">
        <button id="block-day-btn" class="bg-red-600 text-xs font-bold px-3 py-1 rounded">🔒 Блок дня (Выходной)</button>
      </div>
    </div>

    <div class="card space-y-2">
      <div class="font-extrabold text-md">Дневник тренировок на сегодня</div>
      ${ad.todayBookings.length === 0 ? '<div class="hint text-xs">На сегодня записей нет</div>' : ad.todayBookings.map(b => `
        <div class="p-3 bg-gray-50 dark:bg-gray-800 rounded-xl space-y-2 text-xs border border-gray-200">
          <div class="flex justify-between font-bold">
            <span>⏰ b.time—{b.name}</span>
            <span class="text-blue-500">\${b.status}</span>
          </div>
          <button data-finish-id="b.id"data-tg="{b.tgId}" class="bg-green-600 text-white px-3 py-1 rounded font-bold w-full text-center">Завершить занятие</button>
        </div>
      `).join('')}
    </div>

    <div id="finish-form-block" class="card hidden space-y-2 bg-green-50 border border-green-300">
      <div class="font-bold text-sm text-green-800">Завершение занятия пользователя</div>
      <input type="text" id="fin-what" placeholder="Что делали (Программа тренировки)">
      <select id="fin-health">
        <option value="Отлично">Отлично</option>
        <option value="Устал(а)">Устал(а)</option>
        <option value="Болели мышцы/суставы">Болели мышцы/суставы</option>
      </select>
      <div class="flex gap-2">
        <button id="fin-whisper-btn" class="bg-blue-500 text-white font-bold p-2 rounded text-xs">🎤 Запись голоса (Whisper)</button>
        <button id="fin-save-btn" class="bg-green-700 text-white font-bold px-4 py-2 rounded text-xs flex-1">Сохранить в Архив</button>
      </div>
    </div>

    <div class="card space-y-2">
      <div class="font-extrabold text-md">База клиентов студии</div>
      <input type="text" id="client-search" placeholder="Поиск по имени клиента..." class="text-sm">
      <div class="space-y-2 max-h-60 overflow-y-auto pt-2" id="admin-clients-list">
        ${ad.clients.map(c => `
          <div class="p-3 bg-gray-50 dark:bg-gray-800 rounded-xl space-y-1 text-xs client-card" data-name="\${c.name.toLowerCase()}">
            <div class="font-bold text-sm text-blue-600">c.name(Баланс:{c.balance})</div>
            <div>⚠️ <b>Анамнез:</b> <span id="anamnesis-text-c.tgId">{c.anamnesis || 'Нет противопоказаний'}</span></div>
            <div class="text-gray-400">Последние тренировки: \${c.history.join(', ') || 'нет записей'}</div>
            <button data-edit-tg="\${c.tgId}" class="text-blue-500 underline mt-1 block">Редактировать анамнез</button>
          </div>
        `).join('')}
      </div>
    </div>
  </div>`;
}

/* ===== РЕНДЕР И СОБЫТИЯ ===== */
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'".replace('#39;'):'&#39;'}[c]))}

function bind(){
  \$app.querySelectorAll('[data-dur]').forEach(b => b.onclick = () => { S.dur = +b.dataset.dur; S.time = null; render(); });
  app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>S.day=b.dataset.day;S.time=null;render(););app.querySelectorAll('[data-time]').forEach(b => b.onclick = () => { S.time = b.dataset.time; S.slotId = b.dataset.id; render(); });
  
  const commentInput = document.getElementById('book-comment');
  if(commentInput) commentInput.oninput = (e) => S.comment = e.target.value;

  const bConfirm = document.getElementById('book-confirm-btn');
  if(bConfirm) bConfirm.onclick = async () => {
    bConfirm.disabled = true;
    const res = await api('book', {slotId: S.slotId, duration: S.dur/30, comment: S.comment, currentBalance: S.profile.balance});
    if(res.confirmation_url) {
      if(tg?.openLink) tg.openLink(res.confirmation_url); else window.open(res.confirmation_url, '_blank');
    } else if(res.ok) {
      toast('Вы успешно записаны!'); S.tab = 'cab'; initApp();
    } else {
      toast(res.error || 'Ошибка записи'); bConfirm.disabled = false;
    }
  };

  \$app.querySelectorAll('[data-buy]').forEach(b => b.onclick = async () => {
    const res = await api('pay', {tariff: b.dataset.buy, type: 'package'});
    if(res.confirmation_url) { if(tg?.openLink) tg.openLink(res.confirmation_url); else window.open(res.confirmation_url, '_blank'); }
    else toast('Ошибка платежной системы');
  });

  const freezeBtn = document.getElementById('freeze-btn');
  if(freezeBtn) freezeBtn.onclick = async () => {
    const res = await api('freeze');
    if(res.ok){ toast('Абонемент продлен на +14 дней! ❄️'); initApp(); } else toast(res.error);
  };

  // Админские биндинги
  const blockBtn = document.getElementById('block-day-btn');
  if(blockBtn) blockBtn.onclick = async () => {
    const dateVal = document.getElementById('block-date').value;
    const res = await api('blockDay', {date: dateVal});
    if(res.ok) toast(`День ${dateVal} успешно заблокирован!`);
  };

  const searchInp = document.getElementById('client-search');
  if(searchInp) searchInp.oninput = (e) => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.client-card').forEach(card => {
      card.classList.toggle('hidden', !card.dataset.name.includes(q));
    });
  };

  \$app.querySelectorAll('[data-edit-tg]').forEach(b => b.onclick = async () => {
    const tgId = b.dataset.editTg;
    const oldText = document.getElementById(`anamnesis-text-${tgId}`).textContent;
    const newAnamnesis = prompt("Введите новые противопоказания/анамнез клиента:", oldText);
    if(newAnamnesis !== null){
      const res = await api('editAnamnesis', {clientTgId: tgId, anamnesis: newAnamnesis});
      if(res.ok){ document.getElementById(`anamnesis-text-${tgId}`).textContent = newAnamnesis; toast("Сохранено!"); }
    }
  });

  \$app.querySelectorAll('[data-finish-id]').forEach(b => b.onclick = () => {
    S.activeClient = { bookingId: b.dataset.finishId, tgId: b.dataset.tg };
    document.getElementById('finish-form-block').classList.remove('hidden');
    document.getElementById('finish-form-block').scrollIntoView({behavior: 'smooth'});
  });

  const finSave = document.getElementById('fin-save-btn');
  if(finSave) finSave.onclick = async () => {
    finSave.disabled = true;
    const res = await api('finishBooking', {
      bookingId: S.activeClient.bookingId,
      clientTgId: S.activeClient.tgId,
      program: document.getElementById('fin-what').value,
      health: document.getElementById('fin-health').value
    });
    if(res.ok){ toast("Занятие закрыто, данные в архиве!"); loadAdmin(); }
  };

  const whisperBtn = document.getElementById('fin-whisper-btn');
  if(whisperBtn) whisperBtn.onclick = () => {
    toast("Имитация Whisper API: Нажмите 'Разрешить запись' в ТГ боте для аудио");
    document.getElementById('fin-what').value = "Тренировка спины: Тяга верхнего блока 4х12, Гиперэкстензия 3х15. Состояние стабильное.";
  };
}

function initSlider(){
  const slider = document.getElementById('slider');
  if(!slider) return;
  const handle = slider.querySelector('.slider-handle');
  const before = slider.querySelector('.slider-before');
  let isSliding = false;

  const move = (x) => {
    const rect = slider.getBoundingClientRect();
    let pos = ((x - rect.left) / rect.width) * 100;
    if(pos < 0) pos = 0; if(pos > 100) pos = 100;
    S.sliderPos = pos; handle.style.left = `pos%`;before.style.width=`{pos}%`;
  };

  slider.onmousedown = () => isSliding = true;
  window.onmouseup = () => isSliding = false;
  slider.onmousemove = (e) => { if(isSliding) move(e.clientX); };
  slider.ontouchstart = () => isSliding = true;
  window.ontouchend = () => isSliding = false;
  slider.ontouchmove = (e) => { if(isSliding) move(e.touches[0].clientX); };
}

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); });

async function loadAdmin(){
  const data = await api('adminInit');
  S.adminData = data;
  if(S.tab === 'admin') render();
}

async function initApp(){
  try {
    const data = await api('init');
    S.profile = data.profile;
    S.scheduleSlots = data.scheduleSlots || [];
    S.isAdmin = data.isAdmin || false;
    S.loading = false;
    if(S.isAdmin) loadAdmin();
    render();
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="card p-4 text-center text-red-500 font-bold">Ошибка соединения с Google Таблицей.</div>';
  }
}

initApp();
</script>
