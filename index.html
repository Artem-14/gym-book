.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .3s;z-index:60;max-width:90%}

</style></head>

function slotsFor(d){return S.slots.filter(s=>s.date===d).sort((a,b)=>a.time<b.time?-1:1).map(s=>({...s,ok:!!(s.ok&&s.ok[S.dur/30])}))}

async function loadAdmin(){const r=await api('adminData');if(!r.ok)throw new Error(r.error);S.a=r}
async function reload(){const d=await api('init');if(d.ok===false)throw new Error(d.error);S.p=d.profile;S.slots=d.scheduleSlots||[];S.blocked=d.blockedDays||[]}
function go(t){
  S.tab = t;
  S.cl = null;
  S.sh = null;
  render();
  window.scrollTo({top:0});
  if(adm()) {
    S.loading = true; // включаем скелетон на время запроса
    render();
    loadAdmin()
      .then(() => {
        S.loading = false; // выключаем его, когда данные пришли
        render();
      })
      .catch(() => {
        S.loading = false;
        render();
      });
  }
}

function pickPhoto(cb){const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};im.src=URL.createObjectURL(f)};i.click()}
let rec=null;
async function mic(f){
  if(rec){rec.stop();return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],mr=new MediaRecorder(st);rec=mr;
    document.querySelector(`[data-v="${f}"].mic`)?.classList.add('rec');
    mr.ondataavailable=e=>ch.push(e.data);
    mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());rec=null;
      const d=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(new Blob(ch,{type:mr.mimeType}))});
      toast('Распознаю…');
      try{const r=await api('voice',{audio:d});if(!r.ok)throw new Error(r.error);S.sh[f]=(S.sh[f]?S.sh[f]+' ':'')+r.text;paintSheet()}catch(e){hap.err();toast(e.message||'Ошибка распознавания');paintSheet()}};
    mr.start();toast('Говорите… нажмите ещё раз, чтобы закончить');
  }catch(e){toast('Нет доступа к микрофону')}
}
const ACT={
 tab:v=>go(v),
 theme:()=>{theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;try{localStorage.setItem('th',theme)}catch(_){}render()},
 dur:v=>{S.dur=+v;S.time=null;render()},
 day:v=>{S.day=v;S.time=null;render()},
 time:(v,el)=>{S.time=v;S.slotId=el.dataset.id;render()},
 book:async()=>{
  if(!S.time||S.busy)return;const p=S.p,cost=S.dur/60;S.busy=true;render();
  try{
   if(!p.direct&&p.avail<cost){const r=await api('pay',{type:'single',slotId:S.slotId,duration:S.dur/30,comment:S.comment});if(!r.confirmation_url)throw new Error(r.error||'Платёж не создан');openLink(r.confirmation_url);return}
   const r=await api('book',{slotId:S.slotId,duration:S.dur/30,comment:S.comment});if(!r.ok)throw new Error(r.error);
   S.time=null;S.slotId=null;S.comment='';hap.ok();toast('Вы записаны ✅');await reload();go('cab');
  }catch(e){hap.err();toast(e.message||'Не удалось записаться')}finally{S.busy=false;render()}},
 buy:async v=>{try{const r=await api('pay',{type:'package',tariff:v});if(!r.confirmation_url)throw new Error(r.error||'Платёж не создан');openLink(r.confirmation_url)}catch(e){hap.err();toast(e.message||'Сбой сети')}},
 cancel:async()=>{const n=S.p.next;if(!n||hoursLeft(n.date,n.time)<CANCEL_LIMIT_H||!await ask('Отменить тренировку?'))return;
  try{const r=await api('cancel',{bookingId:n.id});if(!r.ok)throw new Error(r.error);await reload();hap.ok();toast('Запись отменена');render()}catch(e){hap.err();toast(e.message||'Не удалось отменить')}},
 freeze:async()=>{if(!await ask('Заморозить абонемент на 14 дней? Доступно один раз за пакет.'))return;
  try{const r=await api('freeze');if(!r.ok)throw new Error(r.error);Object.assign(S.p,{frozen:1,frozenUntil:r.frozenUntil,expires:r.expires});hap.ok();toast('Абонемент заморожен ❄️');render()}catch(e){hap.err();toast(e.message||'Ошибка')}},
 upl:()=>pickPhoto(async d=>{const kind=S.p.pb?'after':'before';
  try{toast('Загружаю…');const r=await api('photo',{kind,data:d});if(!r.ok)throw new Error(r.error);
   if(kind==='after'){S.p.pa=r.url;S.p.paT=r.t}else{S.p.pb=r.url;S.p.pbT=r.t}hap.ok();toast('Фото сохранено');render()}catch(e){hap.err();toast(e.message||'Не удалось загрузить')}}),
 cl:async v=>{S.tab='clients';S.cl=v;S.hist=null;S.sh=null;render();window.scrollTo({top:0});
  try{const r=await api('history',{tgId:v});S.hist=r.items||[]}catch(_){S.hist=[]}render()},
 clx:()=>{S.cl=null;render()},
 anam:()=>{const c=S.a.clients.find(x=>x.id===S.cl);S.sh={t:'an',id:c.id,name:c.name,anam:c.anam,bank:c.bank};paintSheet()},
 bank:v=>{S.sh.bank=v;paintSheet()},
 fin:v=>{const s=S.a.today.find(x=>String(x.row)===String(v));S.sh={t:'fin',row:v,name:s.name,time:s.time,prog:s.program||'',feel:s.feel||''};paintSheet()},
 sclose:()=>{S.sh=null;paintSheet()},
 mic:v=>mic(v),
 ssave:async()=>{const h=S.sh;
  try{if(h.t==='fin'){const r=await api('finish',{row:h.row,program:h.prog,feel:h.feel});if(!r.ok)throw new Error(r.error);S.sh=null;await loadAdmin();hap.ok();toast('Занятие завершено ✅');render()}
   else{const r=await api('setClient',{tgId:h.id,anam:h.anam,bank:h.bank});if(!r.ok)throw new Error(r.error);Object.assign(S.a.clients.find(c=>c.id===h.id),{anam:h.anam,bank:h.bank});S.sh=null;hap.ok();toast('Сохранено');render()}
  }catch(e){hap.err();toast(e.message||'Ошибка')}},
 blk:async()=>{if(!await ask('Заблокировать все свободные слоты на сегодня?'))return;
  try{const r=await api('blockDay',{date:S.a.todayDate});if(!r.ok)throw new Error(r.error);hap.ok();toast(`Заблокировано слотов: ${r.blocked}`+(r.kept?` · записей клиентов: ${r.kept}`:''))}catch(e){hap.err();toast(e.message||'Ошибка')}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;if(el.classList.contains('bd')&&e.target!==el)return;hap.tap();ACT[el.dataset.a]?.(el.dataset.v,el)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.matches('.ba input'))t.parentNode.style.setProperty('--p',t.value+'%');
  else if(t.id==='cm')S.comment=t.value;
  else if(t.id==='q'){S.q=t.value;$('#cl').innerHTML=clientRows()}
  else if(t.dataset.f&&S.sh)S.sh[t.dataset.f]=t.value});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!S.loading&&!S.busy&&!S.sh)reload().then(()=>adm()?loadAdmin():0).then(render).catch(()=>{})});
(async function(){
  render();
  try{await reload();S.loading=false;
    if(adm()){S.tab='diary';await loadAdmin()}
    render();
  }catch(e){$('#app').innerHTML=`<div class="card"><b>Не удалось загрузить данные</b><div class="mut small" style="margin:8px 0 14px;word-break:break-word">${esc(e.message||'Проверьте соединение')}</div><button class="cta" onclick="location.reload()">Повторить</button></div>`}
})();
</script></body></html>
